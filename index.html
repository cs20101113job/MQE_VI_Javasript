<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Inspection Distance (Web Version)</title>
    <!-- 引入 MediaPipe Pose Vision CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0e1117;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 { font-size: 1.8rem; margin-bottom: 5px; }
        .caption { color: #a3a8b8; font-size: 0.95rem; margin-bottom: 20px; }
        
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .video-container {
            flex: 2;
            min-width: 320px;
            position: relative;
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #464855;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* 隱藏原生 video，透過 canvas 渲染與繪製骨架 */
        video {
            display: none;
        }
        canvas {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .sidebar {
            flex: 1;
            min-width: 280px;
            background: #161920;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #464855;
        }
        .control-group {
            margin-bottom: 15px;
        }
        .control-group label {
            display: block;
            font-size: 0.85rem;
            color: #a3a8b8;
            margin-bottom: 5px;
        }
        .control-group input[type="range"] {
            width: 100%;
        }
        
        .card {
            background-color: #262730;
            padding: 12px;
            border-radius: 6px;
            margin-top: 15px;
            border: 1px solid #464855;
        }
        .card-title {
            font-size: 13px;
            color: #a3a8b8;
            margin-bottom: 4px;
        }
        .card-value {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            word-break: break-word;
        }
        .card-value.cyan {
            color: #0dcaf0;
            font-size: 22px;
        }
        
        .speech-btn {
            width: 100%;
            padding: 12px;
            background-color: #198754;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .speech-btn.active {
            background-color: #0d6efd;
        }
    </style>
</head>
<body>

    <h1>📷 Visual Inspection Distance (Web Version)</h1>
    <div class="caption">Standard Range: 30 ~ 32 cm</div>

    <div class="container">
        <!-- 影像顯示區 -->
        <div class="video-container">
            <video id="webcam" playsinline></video>
            <canvas id="output_canvas" width="640" height="480"></canvas>
        </div>

        <!-- 參數與檢測結果區 -->
        <div class="sidebar">
            <button id="speech-btn" class="speech-btn" onclick="initSpeech()">🔊 Click here to enable voice prompt</button>
            
            <div class="control-group">
                <label>
                    <input type="checkbox" id="toggle-3d" checked> Enable 3D World Real-distance Mode
                </label>
            </div>
            
            <div class="control-group">
                <label>Distance Calibration Ratio: <span id="val-calib">0.85</span></label>
                <input type="range" id="slider-calib" min="0.1" max="2.0" value="0.85" step="0.01">
            </div>

            <div class="control-group">
                <label>2D Pixels to Centimeters Ratio: <span id="val-scale">0.15</span></label>
                <input type="range" id="slider-scale" min="0.01" max="0.50" value="0.15" step="0.005">
            </div>

            <hr style="border-color: #464855; margin: 20px 0;">

            <h3>📊 Inspection Result</h3>
            
            <div class="card">
                <div class="card-title">Current Inspection Status</div>
                <div id="status-text" class="card-value">Initializing camera...</div>
            </div>

            <div class="card">
                <div class="card-title">Measurement Distance</div>
                <div id="dist-text" class="card-value cyan">0.0 cm</div>
            </div>
        </div>
    </div>

    <!-- 引入主邏輯 JS -->
    <script src="script.js"></script>
</body>
</html>
